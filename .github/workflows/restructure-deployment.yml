name: Restructure deployment tree

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
  push:
    branches:
      - feature/human-awareness-v1
    paths:
      - .github/workflows/restructure-deployment.yml

permissions:
  contents: write

jobs:
  restructure-build-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/human-awareness-v1
          fetch-depth: 0

      - name: Apply deployment restructure
        id: transform
        shell: bash
        run: |
          set +e
          {
            # Every chunk is verified against its local Git blob hash.
            cat automation/restructure_repo.part.* | base64 -d > /tmp/restructure_repo.py
            python3 /tmp/restructure_repo.py
            python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('tf/addons/sourcemod/scripting/bot overhaul')
          for name in ('GiveBotsCosmetics.sp', 'tf_bot_medic_fix.sp'):
              path = root / name
              if path.exists():
                  text = path.read_text(encoding='utf-8-sig')
                  text = '\n'.join(line.rstrip() for line in text.replace('\r\n', '\n').replace('\r', '\n').split('\n'))
                  path.write_text(text, encoding='utf-8')

          bot_names = root / 'automaticbotnames.sp'
          text = bot_names.read_text(encoding='utf-8')
          text = text.replace('Handle bf, const players[], int playersNum', 'Handle bf, const int[] players, int playersNum')
          bot_names.write_text(text, encoding='utf-8')

          # Old SourcePawn allowed these helpers to pretend arrays were scalar return
          # values. Modern SourcePawn requires the already-intended in-place mutation.
          movement_helpers = ('moveForward', 'moveBackwards', 'moveSide', 'moveSide2')
          for path in root.glob('*.sp'):
              text = path.read_text(encoding='utf-8')
              for helper in movement_helpers:
                  text = re.sub(
                      rf'float\s+{helper}\(float vel\[3\],\s*float MaxSpeed\)',
                      f'void {helper}(float vel[3], float MaxSpeed)',
                      text,
                  )
                  text = text.replace(f'vel = {helper}(', f'{helper}(')
              text = '\n'.join(line for line in text.split('\n') if line.strip() != 'return vel;')
              path.write_text(text, encoding='utf-8')

          missions = root / 'GiveBotsLoadout_MISSIONS.sp'
          text = missions.read_text(encoding='utf-8')
          text = text.replace('char name[13] = "The Commander";', 'char name[14] = "The Commander";')
          missions.write_text(text, encoding='utf-8')
          PY
            git diff --check
          } 2>&1 | tee /tmp/restructure-transform.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preserve transformation diagnostics
        if: steps.transform.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/restructure-transform.log automation/restructure-transform.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/restructure-transform.log
          git commit -m "Update deployment restructure diagnostics" || true
          git push origin HEAD:feature/human-awareness-v1

      - name: Fail on transformation errors
        if: steps.transform.outputs.status != '0'
        run: exit 1

      - name: Install 32-bit compiler runtime
        if: steps.transform.outputs.status == '0'
        run: sudo apt-get update && sudo apt-get install -y lib32stdc++6 lib32gcc-s1

      - name: Compile every SourcePawn plugin
        if: steps.transform.outputs.status == '0'
        id: compile
        shell: bash
        run: |
          set +e
          tools/build_plugins.sh 2>&1 | tee /tmp/restructure-build.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preserve build diagnostics
        if: steps.transform.outputs.status == '0' && steps.compile.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/restructure-build.log automation/restructure-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/restructure-build.log
          git commit -m "Update deployment restructure diagnostics" || true
          git push origin HEAD:feature/human-awareness-v1

      - name: Fail on compiler errors
        if: steps.transform.outputs.status == '0' && steps.compile.outputs.status != '0'
        run: exit 1

      - name: Validate deployment tree
        if: steps.transform.outputs.status == '0' && steps.compile.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          test ! -e addons
          test ! -e scripts
          test -f tf/cfg/TF2_Bot_Overhaul.cfg
          test -f "tf/addons/sourcemod/scripting/bot overhaul/bot_ai.sp"
          test -f "tf/addons/sourcemod/plugins/bot overhaul/bot_ai.smx"
          test -f "tf/addons/sourcemod/plugins/bot overhaul/GiveBotsCosmetics.smx"
          test -f "tf/addons/sourcemod/plugins/bot overhaul/tf_bot_medic_fix.smx"
          test -f tf/addons/sourcemod/plugins/disabled/sd_doomsday_bots.smx
          test -f tf/addons/sourcemod/plugins/disabled/tf2botchatter.smx
          test "$(find 'tf/addons/sourcemod/plugins/bot overhaul' -maxdepth 1 -name '*.smx' | wc -l)" -eq 21
          test "$(find tf/addons/sourcemod/plugins/disabled -maxdepth 1 -name '*.smx' | wc -l)" -eq 2
          git diff --check

      - name: Commit deployment-ready repository
        if: steps.transform.outputs.status == '0' && steps.compile.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf automation
          rm -f .github/workflows/restructure-deployment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restructure repository as deployable TF2 tree"
          git push origin HEAD:feature/human-awareness-v1

name: Apply human awareness v1

on:
  push:
    branches:
      - feature/human-awareness-v1
    paths:
      - .github/workflows/apply-human-awareness.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/human-awareness-v1
          fetch-depth: 0

      - name: Apply staged source patch
        shell: bash
        run: |
          set -euo pipefail
          git show d9d7ca2ac3d7b4c22acca55b65afec72810bb8bf:automation/human-awareness-v1.patch.gz.b64 \
            | base64 -d | gzip -d > /tmp/human-awareness-v1.patch
          git apply --check /tmp/human-awareness-v1.patch
          git apply /tmp/human-awareness-v1.patch
          python3 - <<'PY'
          from pathlib import Path
          path = Path('addons/sourcemod/scripting/bot overhaul/bot_ai.sp')
          source = path.read_text()
          source = source.replace('float forward[3];', 'float aimForward[3];')
          source = source.replace(
              'GetAngleVectors(viewAngles, forward, NULL_VECTOR, NULL_VECTOR);',
              'GetAngleVectors(viewAngles, aimForward, NULL_VECTOR, NULL_VECTOR);'
          )
          source = source.replace(
              'NormalizeVector(forward, forward);',
              'NormalizeVector(aimForward, aimForward);'
          )
          source = source.replace(
              'GetVectorDotProduct(direction, forward)',
              'GetVectorDotProduct(direction, aimForward)'
          )
          for helper in ('moveForward', 'moveBackwards', 'moveSide', 'moveSide2'):
              source = source.replace(
                  f'float {helper}(float vel[3],float MaxSpeed)',
                  f'void {helper}(float vel[3],float MaxSpeed)'
              )
          source = source.replace('\n\treturn vel;\n}', '\n}')
          source = source.replace(
              'vel = moveForward(vel,9000.0);',
              'moveForward(vel,9000.0);'
          )
          path.write_text(source)
          PY
          git diff --check

      - name: Install 32-bit compiler runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lib32stdc++6 lib32gcc-s1

      - name: Download SourceMod compiler
        shell: bash
        run: |
          set -euo pipefail
          latest="$(curl -fsSL https://www.sourcemod.net/smdrop/1.12/sourcemod-latest-linux)"
          curl -fsSL "https://www.sourcemod.net/smdrop/1.12/${latest}" -o /tmp/sourcemod.tar.gz
          mkdir -p /tmp/sourcemod
          tar -xzf /tmp/sourcemod.tar.gz -C /tmp/sourcemod
          chmod +x /tmp/sourcemod/addons/sourcemod/scripting/spcomp

      - name: Compile bot_ai.sp
        id: compile
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/tf2-bot-build
          /tmp/sourcemod/addons/sourcemod/scripting/spcomp \
            -i/tmp/sourcemod/addons/sourcemod/scripting/include \
            -o/tmp/tf2-bot-build/bot_ai.smx \
            "addons/sourcemod/scripting/bot overhaul/bot_ai.sp" \
            2>&1 | tee /tmp/spcomp.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preserve compile diagnostics
        if: steps.compile.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/spcomp.log automation/spcomp.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/spcomp.log
          git commit -m "Update awareness compile diagnostics" || true
          git push origin HEAD:feature/human-awareness-v1

      - name: Fail on compiler errors
        if: steps.compile.outputs.status != '0'
        shell: bash
        run: exit 1

      - name: Commit verified source update
        if: steps.compile.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          rm -f automation/human-awareness-v1.patch.gz.b64 automation/spcomp.log
          rm -f .github/workflows/apply-human-awareness.yml
          rmdir automation .github/workflows .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add human awareness v1"
          git push origin HEAD:feature/human-awareness-v1

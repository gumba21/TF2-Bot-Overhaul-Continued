name: Final Tactical Navigation binary refresh

on:
  push:
    branches:
      - feature/human-awareness-v1
    paths:
      - .github/workflows/refresh-nav12-binary-final.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-awareness-v1
          fetch-depth: 0
      - name: Install compiler runtime
        run: sudo apt-get update && sudo apt-get install -y lib32stdc++6 lib32gcc-s1
      - name: Build complete plugin manifest
        run: tools/build_plugins.sh
      - name: Commit final Tactical Navigation binary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "tf/addons/sourcemod/plugins/bot overhaul/bot_navigation.smx"
          git commit -m "Refresh final Tactical Navigation deployment binary"
          git push origin HEAD:feature/human-awareness-v1

name: Compile SourcePawn plugins

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install 32-bit compiler runtime
        run: sudo apt-get update && sudo apt-get install -y lib32stdc++6 lib32gcc-s1

      - name: Compile every tracked SourcePawn plugin
        shell: bash
        run: |
          set -o pipefail
          tools/build_plugins.sh 2>&1 | tee sourcepawn-build.log

      - name: Preserve compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sourcepawn-build-log
          path: sourcepawn-build.log

      - name: Verify complete deployment plugin set
        shell: bash
        run: |
          set -euo pipefail
          test -f "tf/addons/sourcemod/plugins/bot overhaul/00_navmesh.smx"
          test -f "tf/addons/sourcemod/plugins/bot overhaul/bot_ai.smx"
          test -f "tf/addons/sourcemod/plugins/bot overhaul/bot_knowledge.smx"
          test -f "tf/addons/sourcemod/plugins/bot overhaul/bot_navigation.smx"
          test -f "tf/addons/sourcemod/plugins/bot overhaul/GiveBotsCosmetics.smx"
          test -f "tf/addons/sourcemod/plugins/bot overhaul/tf_bot_medic_fix.smx"
          test -f tf/addons/sourcemod/plugins/disabled/sd_doomsday_bots.smx
          test -f tf/addons/sourcemod/plugins/disabled/tf2botchatter.smx
          test "$(find 'tf/addons/sourcemod/plugins/bot overhaul' -maxdepth 1 -name '*.smx' | wc -l)" -eq 24
          test "$(find tf/addons/sourcemod/plugins/disabled -maxdepth 1 -name '*.smx' | wc -l)" -eq 2

name: Vendor pinned SourcePawn navmesh parser

on:
  push:
    branches:
      - feature/human-awareness-v1
    paths:
      - .github/workflows/vendor-navmesh.yml

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-awareness-v1
          fetch-depth: 0

      - name: Download pinned cross-platform nav access source
        shell: bash
        run: |
          set -euo pipefail
          revision=2179f82ea57410a8840cef6f85b1f66e78f54657
          source_root="tf/addons/sourcemod/scripting/bot overhaul/third_party/sourcepawn-navmesh"
          mkdir -p "$source_root" tf/addons/sourcemod/scripting/include
          curl -fsSL "https://raw.githubusercontent.com/KitRifty/sourcepawn-navmesh/$revision/addons/sourcemod/scripting/navmesh.sp" -o "$source_root/navmesh.sp"
          curl -fsSL "https://raw.githubusercontent.com/KitRifty/sourcepawn-navmesh/$revision/addons/sourcemod/scripting/include/navmesh.inc" -o tf/addons/sourcemod/scripting/include/navmesh.inc
          curl -fsSL "https://raw.githubusercontent.com/KitRifty/sourcepawn-navmesh/$revision/LICENSE" -o "$source_root/LICENSE"
          cat > "$source_root/README.md" <<EOF
          # SourcePawn Navigation Mesh Parser

          Pinned from `KitRifty/sourcepawn-navmesh` at commit `$revision`.

          This GPL-3.0 dependency parses Valve `.nav` files in SourcePawn and exposes TF2 nav areas, adjacency, bounds, portals, grids, and path primitives without a platform-specific engine extension. The original copyright notices remain in `navmesh.sp`; the upstream license is preserved in `LICENSE`.

          Local integration changes should remain isolated from the vendored parser. Tactical scoring and bot decisions live in `bot_navigation.sp` and its `navigation/` modules.
          EOF

      - name: Commit vendored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tf/addons/sourcemod/scripting
          git commit -m "Vendor pinned SourcePawn navmesh parser"
          git push origin HEAD:feature/human-awareness-v1

name: Finish navmesh SourcePawn 1.12 compatibility

on:
  push:
    branches:
      - feature/human-awareness-v1
    paths:
      - .github/workflows/patch-navmesh-compat2.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/human-awareness-v1
          fetch-depth: 0

      - name: Finish native callback compatibility patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('tf/addons/sourcemod/scripting/bot overhaul/third_party/sourcepawn-navmesh/navmesh.sp')
          text = path.read_text(encoding='utf-8-sig')

          anchors = {
              'NavPathCostFunctor iCostFunction,': 'Function iCostFunction,',
              'view_as<Function>(GetNativeFunction(4)),': 'GetNativeFunction(4),',
          }
          for old, new in anchors.items():
              if old not in text:
                  raise SystemExit(f'missing compatibility anchor: {old}')
              text = text.replace(old, new, 1)

          for function_name in (
              'Native_NavMeshAreaGetAdjacentAreas',
              'Native_NavMeshAreaGetIncomingConnections',
          ):
              pattern = rf'(public any {function_name}\(Handle plugin, int numParams\)\n\{{.*?)(\n\}})'
              match = re.search(pattern, text, flags=re.S)
              if not match:
                  raise SystemExit(f'missing function block: {function_name}')
              block = match.group(1).replace('return;', 'return 0;')
              if not block.rstrip().endswith('return 0;'):
                  block = block.rstrip() + '\n\treturn 0;'
              text = text[:match.start()] + block + match.group(2) + text[match.end():]

          function_name = 'Native_CSNavAreaGetApproachInfoList'
          pattern = rf'(public any {function_name}\(Handle plugin, int numParams\)\n\{{.*?)(\n\}})'
          match = re.search(pattern, text, flags=re.S)
          if not match:
              raise SystemExit(f'missing function block: {function_name}')
          block = match.group(1).replace('if (!g_bNavMeshBuilt) return;', 'if (!g_bNavMeshBuilt) return 0;')
          if not block.rstrip().endswith('return 0;'):
              block = block.rstrip() + '\n\treturn 0;'
          text = text[:match.start()] + block + match.group(2) + text[match.end():]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "tf/addons/sourcemod/scripting/bot overhaul/third_party/sourcepawn-navmesh/navmesh.sp"
          git commit -m "Finish navmesh parser SourcePawn 1.12 compatibility"
          git push origin HEAD:feature/human-awareness-v1

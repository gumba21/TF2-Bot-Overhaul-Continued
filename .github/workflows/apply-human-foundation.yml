name: Apply Human Foundation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - feature/human-awareness-v1
    paths:
      - .github/workflows/apply-human-foundation.yml

permissions:
  contents: write

jobs:
  apply-compile-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/human-awareness-v1
          fetch-depth: 0

      - name: Apply Human Foundation transformation
        shell: bash
        run: |
          set -euo pipefail
          base64 -d automation/human-foundation.py.gz.b64 | gzip -d > /tmp/apply_human_foundation.py
          python3 /tmp/apply_human_foundation.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('addons/sourcemod/scripting/bot overhaul/bot_ai.sp')
          source = path.read_text()
          source = source.replace('\\t', '\t')
          path.write_text(source)
          PY
          git diff --check

      - name: Install 32-bit compiler runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lib32stdc++6 lib32gcc-s1

      - name: Download SourceMod compiler
        shell: bash
        run: |
          set -euo pipefail
          latest="$(curl -fsSL https://www.sourcemod.net/smdrop/1.12/sourcemod-latest-linux)"
          curl -fsSL "https://www.sourcemod.net/smdrop/1.12/${latest}" -o /tmp/sourcemod.tar.gz
          mkdir -p /tmp/sourcemod
          tar -xzf /tmp/sourcemod.tar.gz -C /tmp/sourcemod
          chmod +x /tmp/sourcemod/addons/sourcemod/scripting/spcomp

      - name: Compile bot_ai.sp
        id: compile
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/tf2-bot-build
          /tmp/sourcemod/addons/sourcemod/scripting/spcomp \
            -i/tmp/sourcemod/addons/sourcemod/scripting/include \
            -o/tmp/tf2-bot-build/bot_ai.smx \
            "addons/sourcemod/scripting/bot overhaul/bot_ai.sp" \
            2>&1 | tee /tmp/human-foundation-spcomp.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preserve compile diagnostics
        if: steps.compile.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/human-foundation-spcomp.log automation/human-foundation-spcomp.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/human-foundation-spcomp.log
          git commit -m "Update Human Foundation compile diagnostics" || true
          git push origin HEAD:feature/human-awareness-v1

      - name: Fail on compiler errors
        if: steps.compile.outputs.status != '0'
        run: exit 1

      - name: Commit verified Human Foundation
        if: steps.compile.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          rm -f automation/human-foundation.py.gz.b64 automation/human-foundation-spcomp.log
          rm -f .github/workflows/apply-human-foundation.yml
          rmdir automation .github/workflows .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand awareness into Human Foundation"
          git push origin HEAD:feature/human-awareness-v1

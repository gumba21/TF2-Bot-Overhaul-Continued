		"interval" "0.25" // How long until we spawn another
		"class" "auto" // obvious (heavyweapons instead of heavy tho) (use "auto" to randomly pick one but its kinda shit cuz it will pick medics, spies, etc)
		"team" "auto" // obvious (use "auto" to randomly pick one)
		"action_point" "bot_moveto" // Where the bot should go if its told to.
		"initial_command" "goto action point" // One of these actions -> "goto action point", "despawn", "taunt", "cloak", "uncloak", "disguise", "build sentry at nearest sentry hint", "attack sentry at next action point"
		"suppressFire" "0" // Make bots not shoot.
		"disableDodge" "0" // Make bots not dodge.
		"actionOnDeath" "" // Make bots perform action on death. (kOnDeath_RemoveSelf or kOnDeath_MoveToSpectatorTeam)
		"useTeamSpawnPoint" "1" // Use the actual spawns instead of spawning at the origin number.
		"difficulty" "" // Force a specific difficulty. (MUST BE NUMBERS) -1=current tf_bot_difficulty level, 0=easy, 1=normal, 2=hard, 3=expert
		"retainBuildings" "1" // Keep buildings after death.
		"spawnOnlyWhenTriggered" "0" // Spawn only when told to.
		"classname" "bot_generator"
	}
	

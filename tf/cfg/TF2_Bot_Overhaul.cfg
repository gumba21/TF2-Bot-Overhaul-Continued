// TF2 Bot Overhaul Continued
// Loaded automatically by bot_ai.smx on map start.

tf_bot_ai_tweaks 1

// Human Foundation
// -1 follows tf_bot_difficulty, 0-3 are humanized difficulties, 4 is Unfair.
tf_bot_human_awareness 1
tf_bot_human_difficulty -1
tf_bot_human_unfair_omniscience 1

tf_bot_human_fov 155.0
tf_bot_human_hearing 1050.0

tf_bot_human_reaction_min 0.12
tf_bot_human_reaction_max 0.42
tf_bot_human_memory_min 0.65
tf_bot_human_memory_max 1.85
tf_bot_human_target_lock_min 0.80
tf_bot_human_target_lock_max 2.20
tf_bot_human_think_min 0.10
tf_bot_human_think_max 0.38
tf_bot_human_personality_spread 0.32

// Battlefield Knowledge System
// Runs in observation mode by default. The Mad Milk pilot remains disabled until tested.
tf_bot_knowledge_enabled 1
tf_bot_knowledge_debug 0
tf_bot_knowledge_update_rate 0.10
tf_bot_knowledge_group_update_rate 0.50
tf_bot_knowledge_director_update_rate 0.75
tf_bot_knowledge_memory_duration 7.0
tf_bot_knowledge_confidence_decay 0.12
tf_bot_knowledge_spatial_cell_size 768.0
tf_bot_knowledge_max_queries_per_frame 6
tf_bot_knowledge_team_sharing 1
tf_bot_knowledge_unfair_access 0
tf_bot_knowledge_vision_distance 2600.0
tf_bot_knowledge_vision_fov 155.0
tf_bot_knowledge_hearing_distance 1150.0
tf_bot_knowledge_group_distance 725.0
tf_bot_knowledge_mad_milk 0
tf_bot_knowledge_mad_milk_threshold 62.0

	// Modify Existing Entities -Showin
	modify:
	{
		match:
		{
			"targetname" "sspl_timer" //this is a team_round_timer entity. -Afonso
		}
		replace:
		{
			"setup_length" "10"
			// IMPORTANT! MAKE IT END THROUGH A COMMAND INSTEAD OF THE GAME ITSELF SO U STAY ON BLUE TEAM! -Showin
			"OnFinished" "server_command,Command,wait 66; sv_cheats 1; wait 66; mp_forcewin 2,1,1"
			"timer_length" "80"
			"max_length" "80"
		}
		insert:
		{
			"OnSetupFinished" "server_command,Command,wait 66; playgamesound vo/pl_snowycoast/alien1.mp3,0.5,1" 
			"OnSetupFinished" "server_command,Command,wait 66; cc_linger_time 7; wait 66; cc_emit pl_snowycoast_radio_1,0.5,1"
			"OnSetupFinished" "mannrodicks,PlaySound,,1,-1"
			"OnSetupFinished" "construct,PlaySound,,1,-1"
			"OnSetupFinished" "UFO1,TurnOn,,0,-1"
			//"OnSetupFinished" "sspl_timer,Pause,,0.1,-1"
		}
	}

	// Modify Existing Entities
	modify:
	{
		match:
		{
			"targetname" "cap_a_flag"
			"classname"  "team_control_point"
		}
		insert:
		{
			"OnRoundStartOwnedByTeam1" "WARNING_A,TurnOn,,1,-1"
			"OnCapTeam2" "master_control_point,SetWinnerAndForceCaps,3,0,1"
		}
	}
	{
		match:
		{
			"targetname" "cap_b_flag"
			"classname"  "team_control_point"
		}
		insert:

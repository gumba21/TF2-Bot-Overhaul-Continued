	// Modify Existing Entities
	modify:
	{
		match:
		{
			"TeamNum" "3"
			"classname" "info_player_teamspawn"
		}
		replace:
		{
			// Make demo face the easier side by default. (starts with small sentries)
			"origin" "1606 106 -208"
			"angles" "0 -90 0"
		}
	}
	{
		match:
		{
			"classname" "func_door"
		}
		replace:
		{
			"speed" "1200" // Fixes demo getting stuck on door
		}
	}
	{
		match:
		{
			"targetname" "win_cinematic_relay"
			"classname" "logic_relay"
		}
		insert:
		{
			"OnTrigger" "server_command,Command,wait 66; playgamesound vo/arena_byre/alien1.mp3,10.0,1"
		}
	}
	
	// Remove arena logic and deactivate control points. -Afonso
	filter:
	{
		"targetname" "game_arena"
	}
	{
		"classname" "team_control_point"
	}
	{
		"model" "models/props_gameplay/cap_point_base.mdl"
	}
	{
		"classname" "item_healthkit_small" // we don't need them
	}
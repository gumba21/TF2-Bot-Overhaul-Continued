	// Modify Existing Entities
	modify:
	{
		match:
		{
			"classname" "team_control_point"
		}
		replace:
		{
			//"spawnflags" "1" // Hide control point's hud!
			"point_default_owner" "3"
		}
		insert:
		{
			// ON START
			"OnRoundStartOwnedByTeam2" "server_command,Command,wait 66; tf_bot_kick all; tf_bot_quota 0,0,1" // Make sure bots are gone.
			"OnRoundStartOwnedByTeam2" "tf_logic_koth,SetBlueTimer,75,0,-1" // Time until losing without capping point.
			"OnRoundStartOwnedByTeam2" "tf_gamerules,SetBlueKothClockActive,,0,-1" // Make clock start ticking.
			"OnRoundStartOwnedByTeam2" "control_point_1,SetUnlockTime,0,0,-1" // Force point to instantly unlock.
			"OnRoundStartOwnedByTeam2" "tf_logic_koth,SetRedTimer,200,0,-1" // Time until winning after capping point. (includes building time before bots spawn)
			"OnRoundStartOwnedByTeam2" "koth_badlands_hint_1,ShowMessage,,0,-1" // Display hint message!
			"OnRoundStartOwnedByTeam2" "tf2theme1,PlaySound,,1,-1" // Play first song!
			"OnRoundStartOwnedByTeam2" "server_command,Command,wait 66; playgamesound vo/koth_badlands/intro.mp3;,1,1" // Play pauling dialog.
			"OnRoundStartOwnedByTeam2" "server_command,Command,wait 66; cc_linger_time 11; wait 66; cc_emit koth_badlands_radio_1,1,1"
			"OnRoundStartOwnedByTeam2" "Hint1,Show,,3,-1"
			"OnRoundStartOwnedByTeam2" "Hint1-2,Show,,7.5,-1"
			//"OnRoundStartOwnedByTeam2" "Hint2,Show,,20,-1" // Too distracting
			//"OnRoundStartOwnedByTeam2" "Hint2-2,Show,,28,-1" // Too distracting
			//"OnRoundStartOwnedByTeam2" "hint_message_4,display,20,-1" // Display hint message! 
			//"OnRoundStartOwnedByTeam2" "hint_message_4-2,display,28,-1" // Display hint message! 
			//"OnRoundStartOwnedByTeam2" "koth_badlands_hint_2,ShowMessage,,15,-1" // Display hint message!
			//"OnRoundStartOwnedByTeam2" "koth_badlands_hint_2_2,ShowMessage,,27,-1" // Display hint message!
			
			// PHASE 1 BOTS
			"OnRoundStartOwnedByTeam2" "scout_bot_phase1_*,Enable,,2,-1" // Phase 1 Scout bots!
			//"OnRoundStartOwnedByTeam2" "soldier_bot_phase1_*,Enable,12,12,-1" // Phase 1 Soldier bots! // Give a bit of time before he spawns.
			
			// ON CAPTURE
			"OnCapTeam1" "tf_logic_koth,SetBlueTimer,0,0,-1" // Time until losing without capping point.
			//"OnCapTeam1" "hint_message_2,display,0,-1" // Display hint message! 
			//"OnCapTeam1" "hint_message_4,display,15,-1" // Display hint message! 
			//"OnCapTeam1" "hint_message_5,display,25,-1" // Display hint message! 
			//"OnCapTeam1" "hint_message_6,display,35,-1" // Display hint message! 
			"OnCapTeam1" "koth_badlands_timer_1,ShowMessage,,0,-1" // Display hint message!
			"OnCapTeam1" "server_command,Command,wait 66; playgamesound vo/announcer_am_gamestarting05.mp3,5,1" // Play admin dialog.
			"OnCapTeam1" "server_command,Command,wait 66; playgamesound vo/announcer_begins_30sec.mp3,15,1" // Play admin dialog.
			"OnCapTeam1" "server_command,Command,wait 66; playgamesound vo/announcer_begins_30sec.mp3,15,1" // Play admin dialog.
			"OnCapTeam1" "server_command,Command,wait 66; playgamesound vo/announcer_begins_20sec.mp3,25,1" // Play admin dialog.
			"OnCapTeam1" "server_command,Command,wait 66; playgamesound vo/announcer_begins_10sec.mp3,35,1" // Play admin dialog.
			"OnCapTeam1" "server_command,Command,wait 66; playgamesound vo/announcer_plr_racegeneral03.mp3,45,1" // Play admin dialog.
			"OnCapTeam1" "server_command,Command,wait 66; playgamesound vo/koth_badlands/halfway.mp3,125,1" // Play pauling dialog.
			"OnCapTeam1" "server_command,Command,wait 66; cc_linger_time 7; wait 66; cc_emit koth_badlands_radio_2,125,1"
			"OnCapTeam1" "tf2theme1,Volume,0,0,-1" // Stop first song! 
			"OnCapTeam1" "tf2theme2,PlaySound,,1,-1" // Play second song! // Third song plays when first bot spawns.
			"OnCapTeam1" "hint_object_trigger,TurnOff,,45,-1" // Turn off hints.
			"OnCapTeam1" "hint_object,TurnOff,,45,-1" // Turn off hints.
			
			// PHASE 2 BOTS
			// Enemies
			"OnCapTeam1" "solly_bots,Enable,45,45,-1" // Phase 2 Soldier bots! // 45 seconds before spawning! // Phase 2 officially begins!
			"OnCapTeam1" "blu_gang_1,Enable,75,75,-1" // Phase 2 bot formation 1
			"OnCapTeam1" "blu_gang_2,Enable,112,112,-1" // Phase 2 bot formation 2
			"OnCapTeam1" "blu_gang_3_1,Enable,100,145,-1" // Phase 2 bot formation 3
			"OnCapTeam1" "blu_gang_3_2,Enable,125,160,-1" // Phase 2 bot formation 3
			"OnCapTeam1" "blu_gang_3_3,Enable,145,145,-1" // Phase 2 bot formation 3
			"OnCapTeam1" "blu_gang_3_4,Enable,160,160,-1" // Phase 2 bot formation 3
			"OnCapTeam1" "server_command,Command,wait 66; tf_bot_add blue expert medic; wait 66; tf_bot_add blue expert spy,60,1" // Add standard bots.
			"OnCapTeam1" "server_command,Command,wait 66; tf_bot_add blue expert medic; wait 66; tf_bot_add blue expert scout; tf_bot_add blue expert heavyweapons 1,140,1" // Add standard bots.

			// Teammates
			//"OnCapTeam1" "red_friends_pyro,Enable,76,76,-1" // Phase 2 RED Pyro bots! // 70 seconds before spawning!
			//"OnCapTeam1" "red_friends_heavy,Enable,135,100,-1" // Phase 2 RED Heavy bots! // 100 seconds before spawning!
			//"OnCapTeam1" "red_friends_demo,Enable,130,130,-1" // Phase 2 RED Demo bots! // 130 seconds before spawning!
			"OnCapTeam1" "server_command,Command,wait 66; tf_bot_add red expert heavyweapons;,75,1" // Add standard bots.
			"OnCapTeam1" "server_command,Command,wait 66; tf_bot_add red expert medic;,74,1" // Add standard bots.
			"OnCapTeam1" "server_command,Command,wait 66; tf_bot_add red expert 3;,175,1" // Add standard bots.
		}

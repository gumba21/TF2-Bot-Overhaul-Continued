	// Change Timer
	{
		match:
		{
			"targetname" "game_timer"
			"classname" "team_round_timer"
		}
		replace:
		{	
			"timer_length" "190"
			"start_paused" "1"
		}
	}
	// Hide Control Points Hud
	{
		match:
		{
			"classname" "team_control_point_master"
		}
		insert:
		{	
			"spawnflags" "1" // Supposed to hide hud but doesnt work so we gotta use custom pos
			"cpm_restrict_team_cap_win" "1"
		}
		replace:
		{
			"custom_position_y" "-9999"
			"custom_position_x" "-9999"
		}
	}
	// Make middle point owned by red (to reference engineer gaming)
	{
		match:
		{
			"targetname" "cap_center"
			"classname" "team_control_point"
		}
		replace:
		{	
			"point_default_owner" "2"
		}
	}
	// Make small ammopacks and medkits into medium
	{
		match:
		{
			"classname" "item_healthkit_small"
		}
		replace:
		{	
			"classname" "item_healthkit_medium"
		}
	}
	{
		match:
		{
			"classname" "item_ammopack_small"
		}
		replace:
		{	
			"classname" "item_ammopack_full" // changed from medium to full in invasion update
		}
	}
	// Make sure bots leave on loss!
	{
		match:
		{
			"classname"  "logic_auto" 
		}
		insert:
